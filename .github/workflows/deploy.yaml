name: Build and Deploy Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'

jobs:

  # ==========================================
  # STAGE 0: DETECT CHANGES
  # ==========================================
  detect-changes:
    name: Detect Changed Folders
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check which folders changed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'


  # ==========================================
  # STAGE 1: LOGIN
  # ==========================================
  login:
    name: Docker Hub Login
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_changed == 'true' || needs.detect-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}


  # ==========================================
  # STAGE 2: BUILD & PUSH BACKEND
  # ==========================================
  build-backend:
    name: Build and Push Backend
    needs: [detect-changes, login]
    if: needs.detect-changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sms-backend:v${{ github.run_number }}


  # ==========================================
  # STAGE 3: BUILD & PUSH FRONTEND
  # ==========================================
  build-frontend:
    name: Build and Push Frontend
    needs: [detect-changes, login]
    if: needs.detect-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sms-frontend:v${{ github.run_number }}


  # ==========================================
  # STAGE 4: DEPLOY DATABASE (MySQL)
  # ==========================================
  deploy-database:
    name: Deploy MySQL Container
    needs: [detect-changes, login]
    if: needs.detect-changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "SSH CONNECTION SUCCESS"
            whoami
            hostname

      - name: Create Docker network
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker network create sms-network || true

      - name: Deploy MySQL to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Deploying MySQL..."

            docker pull mysql:8.0

            docker stop sms-mysql || true
            docker rm sms-mysql || true

            docker run -d \
              --name sms-mysql \
              --restart unless-stopped \
              --network sms-network \
              -p 3306:3306 \
              -e MYSQL_ROOT_PASSWORD=root9090 \
              -e MYSQL_DATABASE=sms \
              -e MYSQL_USER=sms_user \
              -e MYSQL_PASSWORD=root9090 \
              -v sms-mysql-data:/var/lib/mysql \
              mysql:8.0

            echo "MySQL deployed successfully"


  # ==========================================
  # STAGE 5: DEPLOY BACKEND
  # ==========================================
  deploy-backend:
    name: Deploy Backend
    needs: [detect-changes, build-backend, deploy-database]
    if: needs.detect-changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "SSH CONNECTION SUCCESS"
            whoami
            hostname

      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Deploying backend..."

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/sms-backend:v${{ github.run_number }}

            docker stop sms-backend || true
            docker rm sms-backend || true

            docker run -d \
              --name sms-backend \
              --restart unless-stopped \
              --network sms-network \
              -p 8000:8000 \
              -e MYSQL_HOST=sms-mysql \
              -e MYSQL_PORT=3306 \
              -e MYSQL_USER=sms_user \
              -e MYSQL_PASSWORD=root9090 \
              -e MYSQL_DATABASE=sms \
              ${{ secrets.DOCKERHUB_USERNAME }}/sms-backend:v${{ github.run_number }}

            echo "Backend deployed successfully"


  # ==========================================
  # STAGE 6: DEPLOY FRONTEND
  # ==========================================
  deploy-frontend:
    name: Deploy Frontend
    needs: [detect-changes, build-frontend]
    if: needs.detect-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "SSH CONNECTION SUCCESS"
            whoami
            hostname

      - name: Deploy Frontend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Deploying frontend..."

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/sms-frontend:v${{ github.run_number }}

            docker stop sms-frontend || true
            docker rm sms-frontend || true

            docker run -d \
              --name sms-frontend \
              --restart unless-stopped \
              -p 80:5173 \
              ${{ secrets.DOCKERHUB_USERNAME }}/sms-frontend:v${{ github.run_number }}

            echo "Frontend deployed successfully"